<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你在猫友圈里是什么猫猫塑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='35' fill='%23ffb84d'/%3E%3Cpolygon points='25,35 35,10 50,30' fill='%23ffb84d'/%3E%3Cpolygon points='75,35 65,10 50,30' fill='%23ffb84d'/%3E%3Ccircle cx='40' cy='52' r='4' fill='%23333'/%3E%3Ccircle cx='60' cy='52' r='4' fill='%23333'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f6efe6;
    color: #2b2620;
    line-height: 1.6;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fffaf3;
    box-shadow: 0 0 40px rgba(120, 80, 30, 0.08);
    position: relative;
  }
  .view { display: none; min-height: 100vh; padding: 24px 22px 40px; animation: fadeIn .35s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }

  /* ===== 首页 ===== */
  .hero-cat {
    width: 130px; height: 130px; margin: 40px auto 18px; display:block;
  }
  .hero-cat svg { width:100%; height:100%; }
  h1.title {
    font-size: 28px; font-weight: 900; text-align: center; letter-spacing: 1px;
    color: #3a2e22; line-height: 1.3;
  }
  .subtitle {
    text-align:center; color:#8a7a66; font-size:14px; margin-top:12px;
  }
  .intro-card {
    background:#fff; border-radius:18px; padding:18px 18px; margin-top:26px;
    box-shadow: 0 4px 18px rgba(150,100,40,.08);
    font-size: 14px; color:#5b4e3e;
  }
  .intro-card h3 { font-size:15px; color:#3a2e22; margin-bottom:8px; }
  .intro-card ul { padding-left: 18px; }
  .intro-card li { margin: 4px 0; }
  .meta-row {
    display:flex; justify-content:center; gap:18px; margin-top:36px;
    color:#8a7a66; font-size:13px;
  }
  .cat-preview {
    display:flex; justify-content:center; gap:10px; margin-top:20px;
  }
  .cat-preview img {
    width:52px; height:52px; border-radius:50%; object-fit:cover;
    border:2px solid #fff; box-shadow:0 2px 8px rgba(150,100,40,.15);
  }
  .cat-preview img:nth-child(1){ transform: translateY(0); }
  .cat-preview img:nth-child(2){ transform: translateY(-6px); }
  .cat-preview img:nth-child(3){ transform: translateY(0); }
  .cat-preview img:nth-child(4){ transform: translateY(-6px); }
  .cat-preview img:nth-child(5){ transform: translateY(0); }
  .home-foot {
    text-align:center; color:#b8a488; font-size:12px; margin-top:14px;
  }
  .float-deco {
    position:absolute; opacity:0.5; pointer-events:none;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .meta-row span::before { content:"·"; margin-right:6px; color:#d4b896; }
  .btn-primary {
    display:block; width:100%; margin-top:34px;
    background: linear-gradient(135deg, #ff9a56, #ff6b6b);
    color:#fff; border:none; border-radius: 999px;
    padding: 16px; font-size:17px; font-weight:700; letter-spacing:1px;
    box-shadow: 0 8px 20px rgba(255,120,80,.35);
    cursor:pointer; transition: transform .15s;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(.97); }

  /* ===== 答题 ===== */
  .progress-wrap { margin-bottom: 18px; }
  .progress-label { display:flex; justify-content:space-between; font-size:12px; color:#a08e76; margin-bottom:6px; }
  .progress-bar { height:6px; background:#efe4d2; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background: linear-gradient(90deg,#ffb37a,#ff7a7a); width:0; transition: width .3s; border-radius:3px; }
  .q-text {
    font-size: 20px; font-weight: 700; color:#2b2620; margin: 22px 0 22px; line-height:1.45;
  }
  .options { display:flex; flex-direction:column; gap:12px; }
  .opt {
    background:#fff; border: 2px solid #f0e4d2; border-radius:14px;
    padding: 15px 16px; font-size:15px; color:#3d342a;
    cursor:pointer; transition: all .18s; text-align:left; font-family:inherit;
    line-height:1.5;
  }
  .opt:hover { border-color:#ffb37a; background:#fff8f0; }
  .opt.selected { border-color:#ff7a59; background:#fff1e6; color:#c0392b; font-weight:500; }
  .opt .opt-key {
    display:inline-block; width:22px; height:22px; line-height:22px; text-align:center;
    background:#f4e8d4; color:#8a6a3e; border-radius:6px; font-size:12px; font-weight:700;
    margin-right:8px;
  }
  .opt.selected .opt-key { background:#ff7a59; color:#fff; }

  /* ===== 结果页 ===== */
  .result-hero { text-align:center; margin-top: 10px; }
  .result-cat-icon { width:110px; height:110px; margin:0 auto 10px; }
  .result-type { font-size:13px; color:#a08e76; letter-spacing:2px; }
  .result-name { font-size: 26px; font-weight:900; color:#2b2620; margin: 6px 0 4px; }
  .result-emoji-line { font-size:13px; color:#ff7a59; }
  .tag-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0 6px; }
  .tag {
    background:#fff; color:#a06a3e; border:1px solid #f0d8b8;
    padding:4px 11px; border-radius:999px; font-size:12px;
  }
  .result-comment {
    background:#fff; border-radius:16px; padding:16px; margin:18px 0;
    font-size:14px; color:#5b4e3e; border-left:3px solid #ffb37a;
  }
  #radar { width:100%; height:320px; margin: 10px 0 4px; }
  .block-title {
    font-size:15px; font-weight:700; color:#3a2e22; margin:20px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .block-title::before { content:""; width:4px; height:16px; background:#ff9a56; border-radius:2px; }
  .block {
    background:#fff; border-radius:14px; padding:14px 16px; font-size:14px; color:#5b4e3e;
    margin-bottom:12px;
  }
  .block ol { padding-left: 20px; }
  .block ol li { margin: 6px 0; }
  .tagline {
    background: linear-gradient(135deg,#fff3e6,#ffe6d4);
    border-radius:14px; padding:16px; text-align:center;
    font-size:15px; font-weight:700; color:#c0552a; margin:18px 0;
  }
  .badge {
    display:inline-block; background:linear-gradient(135deg,#ffd76a,#ff9a56);
    color:#fff; font-size:12px; padding:4px 10px; border-radius:999px;
    margin-left:6px;
  }
  .btn-again {
    display:block; width:100%; margin-top:18px;
    background:#fff; color:#ff7a59; border:2px solid #ffb37a; border-radius:999px;
    padding:14px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .share-hint { text-align:center; color:#a08e76; font-size:12px; margin-top:14px; }
  .radar-poly { transform-origin: center; transform-box: fill-box; animation: radarGrow .7s ease-out; }
  @keyframes radarGrow { from { transform: scale(0); opacity:0; } to { transform: scale(1); opacity:1; } }
</style>
</head>
<body>

/* ============ 状态与路由 ============ */
let state = { idx:0, scores:[0,0,0,0], selected:[] };
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function startQuiz(){
  state = { idx:0, scores:[0,0,0,0], selected:[] };
  renderQ();
  show('view-quiz');
}
function restart(){ show('view-home'); }

/* ============ 答题渲染 ============ */
function renderQ(){
  const i = state.idx;
  const total = QUESTIONS.length;
  document.getElementById('progress-text').textContent = `第 ${i+1} / ${total} 题`;
  document.getElementById('progress-pct').textContent = Math.round((i)/total*100)+'%';
  document.getElementById('progress-fill').style.width = (i/total*100)+'%';
  document.getElementById('q-text').textContent = QUESTIONS[i].q;
  const box = document.getElementById('options');
  box.innerHTML = '';
  const keys = ['A','B','C','D'];
  QUESTIONS[i].o.forEach((text, k)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${keys[k]}</span>${text}`;
    btn.onclick = ()=>choose(k);
    box.appendChild(btn);
  });
}
function choose(k){
  // k: 0=D1(布偶) 1=D2(英短) 2=D3(橘) 3=D4(狸花)
  state.scores[k]++;
  state.selected.push(k);
  if(state.idx < QUESTIONS.length-1){
    state.idx++;
    renderQ();
  } else {
    finish();
  }
}

/* ============ 计分与判定 ============ */
function judge(scores){
  const [s1,s2,s3,s4] = scores;
  const maxS = Math.max(...scores);
  const minS = Math.min(...scores);
  const rangeS = maxS - minS;
  // 彩蛋
  if(maxS <= 5 && rangeS <= 2) return { type:'capybara', extra:null, mixed:null };
  // 主结果：按优先级 D4 > D3 > D2 > D1
  const order = [4,3,2,1]; // 对应 s4,s3,s2,s1
  const vals  = { 1:s1, 2:s2, 3:s3, 4:s4 };
  let best = order.find(o => vals[o] === maxS);
  // 检查并列
  const tied = order.filter(o => vals[o] === maxS);
  const keyMap = {1:'ragdoll',2:'shorthair',3:'orange',4:'lihua'};
  let mixed = tied.length>1 ? keyMap[tied.find(o=>o!==best)] : null;
  // 附加徽章
  let badge = null;
  if(maxS === 18) badge = '纯血纯种认证';
  else if(maxS >= 14) badge = '极致版人格';
  return { type: keyMap[best], extra: badge, mixed: mixed };
}

/* ============ 结束与结果渲染 ============ */
function finish(){
  document.getElementById('progress-fill').style.width = '100%';
  const r = judge(state.scores);
  const data = RESULTS[r.type];
  const R = r.type;
  window._shareData = { type: R, scores: [...state.scores], name: data.name, tags: data.tags, tagline: data.tagline, color: data.color, extra: r.extra, mixed: r.mixed };

  document.getElementById('result-type').textContent = data.type;
  document.getElementById('result-name').textContent = data.name;
  if(r.extra){
    document.getElementById('result-name').innerHTML += ` <span class="badge">${r.extra}</span>`;
  }
  if(r.mixed){
    const other = RESULTS[r.mixed];
    document.getElementById('result-name').innerHTML += ` <span class="badge" style="background:linear-gradient(135deg,#bbb,#888)">混血·${other.name.split('·').pop()||other.name}</span>`;
  }
  const tagsEl = document.getElementById('result-tags');
  tagsEl.innerHTML = '';
  data.tags.forEach(t=>{
    const s = document.createElement('span');
    s.className = 'tag'; s.textContent = '#'+t;
    tagsEl.appendChild(s);
  });
  document.getElementById('result-comment').textContent = data.comment;
  document.getElementById('result-analysis').textContent = data.analysis;
  const adv = document.getElementById('result-advice');
  adv.innerHTML = '';
  data.advice.forEach(a=>{
    const li = document.createElement('li'); li.textContent = a; adv.appendChild(li);
  });
  document.getElementById('result-tagline').textContent = '“'+data.tagline+'”';

  // 结果猫图标
  document.getElementById('result-icon').innerHTML = catSVG(data.color, R);

  show('view-result');

}

/* ============ 雷达图（纯 SVG，零外部依赖） ============ */
function drawRadar(scores, mainType){
  const el = document.getElementById('radar');
  const dims = [
    { name:'黏人亲和', val: scores[0], angle: -90 },   // 上 D1
    { name:'探索精力', val: scores[3], angle:   0 },   // 右 D4
    { name:'佛系安逸', val: scores[2], angle:  90 },   // 下 D3
    { name:'高冷独立', val: scores[1], angle: 180 }   // 左 D2
  ];
  const colorMap = { ragdoll:'#ff9ec4', shorthair:'#7a8ba6', orange:'#ff9a3c', lihua:'#b5763a', capybara:'#9bbf8a' };
  const color = colorMap[mainType] || '#ff9a56';

  const W=360, H=300, cx=180, cy=150, R=90;
  const pt = (angleDeg, r) => {
    const a = angleDeg * Math.PI / 180;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  // 网格圈
  let grid = '';
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts = dims.map(d=>pt(d.angle, R*f).join(',')).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="#e8d9c0" stroke-width="1"/>`;
  });
  // 轴线
  let axes = '';
  dims.forEach(d=>{
    const [x,y] = pt(d.angle, R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e0cdb0" stroke-width="1"/>`;
  });
  // 标签
  let labels = '';
  dims.forEach(d=>{
    const [x,y] = pt(d.angle, R+28);
    const anchor = Math.abs(x-cx)<5 ? 'middle' : (x>cx?'start':'end');
    labels += `<text x="${x}" y="${y+5}" text-anchor="${anchor}" fill="#5b4e3e" font-size="15" font-weight="600">${d.name}</text>`;
  });
  // 数据多边形
  const dataPts = dims.map(d=>pt(d.angle, d.val/18*R).join(',')).join(' ');
  // 数据点
  let dots = '';
  dims.forEach(d=>{
    const [x,y] = pt(d.angle, d.val/18*R);
    dots += `<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"/>`;
  });

  el.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:340px;display:block;margin:0 auto">
    ${grid}
    ${axes}
    <polygon points="${dataPts}" fill="${color}55" stroke="${color}" stroke-width="2.5" class="radar-poly"/>
    ${dots}
    ${labels}
  </svg>`;
}

  // 背景渐变
  const bg = ctx.createLinearGradient(0,0,0,1200);
  bg.addColorStop(0,'#fffaf3'); bg.addColorStop(1,'#ffe6d0');
  ctx.fillStyle = bg; ctx.fillRect(0,0,750,1200);

  // 顶部猫脸（用真实插画图片）
  const cx=375, cy=180, R=85;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function(){
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(img, cx-R, cy-R, R*2, R*2);
    ctx.restore();
    finishDraw(ctx, d, cx, cy, cv);
  };
  img.onerror = function(){
    // 图片加载失败画个圆
    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
    finishDraw(ctx, d, cx, cy, cv);
  };
  img.src = CAT_IMGS[d.type] || CAT_IMGS.orange;
}

function finishDraw(ctx, d, cx, cy, cv){
  const R=85;

  // 标题
  ctx.fillStyle = '#a08e76'; ctx.font = '500 22px "Noto Sans SC", sans-serif'; ctx.textAlign='center';
  ctx.fillText('YOUR CAT TYPE · 你的猫格', cx, 320);

  // 结果名
  ctx.fillStyle = '#2b2620'; ctx.font = '900 52px "Noto Sans SC", sans-serif';
  ctx.fillText(d.name, cx, 390);

  // 标签（先测总宽再居中）
  ctx.font = '500 20px "Noto Sans SC", sans-serif';
  const tagWidths = d.tags.map(t => ctx.measureText('#'+t).width + 30);
  const totalW = tagWidths.reduce((a,b)=>a+b,0) + (d.tags.length-1)*12;
  let tx = cx - totalW/2;
  d.tags.forEach((t,i)=>{
    const w = tagWidths[i];
    ctx.fillStyle = '#fff';
    roundRect(ctx, tx, 420, w, 38, 19); ctx.fill();
    ctx.strokeStyle = '#f0d8b8'; ctx.lineWidth=1.5; roundRect(ctx, tx, 420, w, 38, 19); ctx.stroke();
    ctx.fillStyle = '#a06a3e';
    ctx.fillText('#'+t, tx+w/2, 445);
    tx += w + 12;
  });

  // 雷达图
  const rc=375, rcy=720, RR=140;
  const dims = [
    {name:'黏人亲和', v:d.scores[0], a:-90},
    {name:'探索精力', v:d.scores[3], a:0},
    {name:'佛系安逸', v:d.scores[2], a:90},
    {name:'高冷独立', v:d.scores[1], a:180}
  ];
  const pt = (angDeg, r)=>{ const a=angDeg*Math.PI/180; return [rc+r*Math.cos(a), rcy+r*Math.sin(a)]; };
  // 网格
  [0.25,0.5,0.75,1].forEach(f=>{
    ctx.strokeStyle='#e8d9c0'; ctx.lineWidth=1;
    ctx.beginPath();
    dims.forEach((dim,i)=>{ const [x,y]=pt(dim.a, RR*f); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.closePath(); ctx.stroke();
  });
  // 轴线
  dims.forEach(dim=>{ const [x,y]=pt(dim.a, RR); ctx.beginPath(); ctx.moveTo(rc,rcy); ctx.lineTo(x,y); ctx.stroke(); });
  // 数据多边形
  ctx.beginPath();
  dims.forEach((dim,i)=>{ const [x,y]=pt(dim.a, dim.v/18*RR); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.closePath();
  ctx.fillStyle = d.color+'55'; ctx.fill();
  ctx.strokeStyle = d.color; ctx.lineWidth=3; ctx.stroke();
  // 数据点
  dims.forEach(dim=>{ const [x,y]=pt(dim.a, dim.v/18*RR); ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fillStyle=d.color; ctx.fill(); });
  // 轴标签
  ctx.fillStyle='#5b4e3e'; ctx.font='600 18px "Noto Sans SC", sans-serif';
  dims.forEach(dim=>{
    const [x,y]=pt(dim.a, RR+26);
    ctx.textAlign = Math.abs(x-rc)<5?'center':(x>rc?'left':'right');
    ctx.fillText(dim.name, x, y+6);
  });

  // 金句
  ctx.fillStyle = '#c0552a'; ctx.font='700 26px "Noto Sans SC", sans-serif'; ctx.textAlign='center';
  // 自动换行（简单按长度）
  const words = d.tagline;
  if(words.length>18){
    const mid = Math.ceil(words.length/2);
    ctx.fillText('“'+words.slice(0,mid)+'”', cx, 990);
    ctx.fillText('“'+words.slice(mid)+'”', cx, 1030);
  } else {
    ctx.fillText('“'+words+'”', cx, 1010);
  }

  // 底部
  ctx.fillStyle='#a08e76'; ctx.font='400 18px "Noto Sans SC", sans-serif';
  ctx.fillText('测测你在猫友圈里是哪只猫 →', cx, 1140);

  // 输出
  const url = cv.toDataURL('image/png');
  document.getElementById('share-img').src = url;
  document.getElementById('share-modal').style.display = 'flex';
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
</script>
